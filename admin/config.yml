backend:
  name: github
  repo: sopiyan-go-id/sopiyan-go-id.github.io
  branch: main
  use_pkce: true
  auth_type: "pkce"
  app_id: "Ov23li8an2cC2K0wC32J"
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: "https://sopiyan-go-id.github.io"
display_url: "https://sopiyan-go-id.github.io"
locale: "id"

collections:
  - name: "konten_dinamis"
    label: "Manajemen Website"
    editor: { preview: false }
    files:
      - name: "berita"
        label: "Berita & Kegiatan"
        file: "data/berita.json"
        fields:
          - { label: "Daftar Artikel", name: "artikel", widget: "list", fields: [
              { label: "Status Publikasi", name: "status", widget: "select", options: ["Terbit", "Draf"], default: "Terbit" },
              { label: "Berita Unggulan", name: "unggulan", widget: "boolean", default: false },
              { label: "Judul Artikel", name: "judul", widget: "string" },
              { label: "Slug (URL tanpa spasi)", name: "slug", widget: "string" },
              { label: "Kategori", name: "kategori", widget: "string" },
              { label: "Tanggal", name: "tanggal", widget: "datetime", format: "YYYY-MM-DD" },
              { label: "Lokasi", name: "lokasi", widget: "string", default: "Lampung Selatan" },
              { label: "Foto Utama", name: "foto", widget: "image" },
              { label: "Ringkasan", name: "ringkasan", widget: "text" },
              { label: "Isi Berita", name: "isi", widget: "markdown" }
            ]}
